name: Mirror snapshot from deployment

# Keeps public/data/fpl-snapshot.json identical to what the published deployment serves,
# including bookmaker-odds enrichment that cannot be fetched from a sandboxed dev machine.
on:
  schedule:
    - cron: '41 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Shares the refresh group so the two snapshot jobs never push at the same time.
concurrency:
  group: refresh-fpl-snapshot
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror deployment snapshot into the repo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch published snapshot
        env:
          VORTEX_UPSTREAM_BASE: https://fplvortex.onrender.com
        run: npm run data:mirror

      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- public/data/fpl-snapshot.json; then
            echo "Mirrored snapshot is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/fpl-snapshot.json
          git commit -m "chore(data): mirror deployment snapshot [skip ci]"
          git push
