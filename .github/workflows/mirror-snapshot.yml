name: Mirror deployment snapshot

# Manual, low-permission trigger: bumping .github/mirror-request.txt asks a runner to pull the
# published deployment's snapshot into public/data/fpl-snapshot.json. Runs are also useful from
# branches, where `workflow_dispatch` is not registered yet.
on:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - '.github/mirror-request.txt'

permissions:
  contents: write

concurrency:
  group: refresh-fpl-snapshot
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror published snapshot into the repo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch published snapshot
        env:
          VORTEX_UPSTREAM_BASE: https://fplvortex.onrender.com
        run: npm run data:mirror

      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- public/data/fpl-snapshot.json; then
            echo "Mirrored snapshot is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/fpl-snapshot.json
          git commit -m "chore(data): mirror deployment snapshot [skip ci]"
          git push
