name: Refresh FPL snapshot

on:
  schedule:
    # Hourly recovery opportunities: a delayed/dropped run no longer creates a 6h gap.
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/refresh-data.yml']
  workflow_dispatch:
    inputs:
      source:
        description: 'Where to pull the snapshot from'
        type: choice
        default: fpl
        options:
          - fpl
          - deployment

permissions:
  contents: write

concurrency:
  group: refresh-fpl-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    name: Regenerate offline data snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch and normalize public FPL data
        id: official
        continue-on-error: true
        if: ${{ github.event.inputs.source != 'deployment' }}
        run: npm run data:refresh

      - name: Archive completed official FPL matches
        if: ${{ steps.official.outcome == 'success' }}
        run: npm run data:archive-matches

      - name: Archive prospective model inputs and match settled outcomes
        id: forecast_archive
        continue-on-error: true
        if: ${{ steps.official.outcome == 'success' }}
        run: |
          npm run data:archive-forecasts
          npm run data:settle-forecasts

      - name: Report optional archive failure
        if: ${{ steps.forecast_archive.outcome == 'failure' }}
        run: echo '::warning::Prospective forecast archive failed. Official snapshot refresh remains independent; inspect archive diagnostics.'

      - name: Mirror the published deployment snapshot
        if: ${{ github.event.inputs.source == 'deployment' || steps.official.outcome == 'failure' }}
        env:
          VORTEX_UPSTREAM_BASE: https://fplvortex.onrender.com
        run: npm run data:mirror

      - name: Reject stale, incomplete or unverified recovery data
        run: node --import tsx scripts/check-snapshot.ts

      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- public/data/fpl-snapshot.json data/fpl-match-history data/forecast-archive && [ -z "$(git ls-files --others --exclude-standard -- data/fpl-match-history data/forecast-archive)" ]; then
            echo "Snapshot is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/fpl-snapshot.json data/fpl-match-history data/forecast-archive
          git commit -m "chore(data): refresh FPL snapshot [skip ci]"
          # Rebase only our generated files over unrelated commits; conflicts fail visibly.
          git pull --rebase origin main
          git push

      - name: Report refresh failure
        if: failure()
        run: |
          echo '::error::Snapshot refresh failed. The previous recovery snapshot was retained; inspect this run before calling it fresh.'
          echo '## Snapshot refresh FAILED — previous recovery data retained' >> "$GITHUB_STEP_SUMMARY"


