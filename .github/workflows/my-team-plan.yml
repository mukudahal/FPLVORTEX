name: My Team Planner
on:
  workflow_dispatch:
    inputs:
      horizon:
        description: Upcoming gameweeks (auto extends through the goal, up to eight)
        default: 'auto'
        type: choice
        options: ['auto', '1', '2', '3', '4', '5', '6', '7', '8']
      target_gameweek:
        description: Gameweek to reach the overall rank goal
        default: '19'
        type: string
      completed_transfers:
        description: 'Optional JSON for free moves already made, with gameweek and moves (outId, inId, sellTenths, buyTenths)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: manual-my-team-plan
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --import tsx --test tests/my-team-plan.test.ts
      - name: Restore previous rank checkpoints
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/vortex-rank
          key: vortex-rank-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vortex-rank-v1-${{ github.ref_name }}-
      - name: Generate plan from the next official deadline
        env:
          PLAN_HORIZON: ${{ inputs.horizon }}
          TARGET_GAMEWEEK: ${{ inputs.target_gameweek }}
          COMPLETED_TRANSFERS: ${{ inputs.completed_transfers }}
          VORTEX_RANK_CHECKPOINTS: ${{ runner.temp }}/vortex-rank/checkpoints.json
          VORTEX_PLAN_CONTEXT: ${{ runner.temp }}/my-team-context.json
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const context = { rankGoal: { rank: 10000, gameweek: Number(process.env.TARGET_GAMEWEEK) } };
          if (process.env.PLAN_HORIZON !== 'auto') context.horizon = Number(process.env.PLAN_HORIZON);
          if (process.env.COMPLETED_TRANSFERS.trim()) context.completedTransfers = JSON.parse(process.env.COMPLETED_TRANSFERS);
          writeFileSync(process.env.VORTEX_PLAN_CONTEXT, JSON.stringify(context), { mode: 0o600 });
          JS
          node --import tsx scripts/export-my-team-plan.ts 145784 reports/my-team
      - name: Publish plan in the run summary
        run: cat reports/my-team/plan.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain settled rank checkpoints
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/vortex-rank
          key: vortex-rank-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
