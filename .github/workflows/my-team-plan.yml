name: My Team Planner
on:
  workflow_dispatch:
    inputs:
      horizon:
        description: Upcoming gameweeks from the next deadline
        default: '5'
        type: choice
        options: ['1', '2', '3', '4', '5', '6', '7', '8']
      completed_transfers:
        description: 'Completed free transfers as JSON with gameweek and moves (outId, inId, sellTenths, buyTenths)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: manual-my-team-plan
  cancel-in-progress: false
jobs:
  plan:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --import tsx --test tests/my-team-plan.test.ts
      - name: Generate plan from the next official deadline
        env:
          VORTEX_COMPLETED_TRANSFERS: ${{ inputs.completed_transfers }}
          PLAN_HORIZON: ${{ inputs.horizon }}
          VORTEX_PLAN_CONTEXT: ${{ runner.temp }}/my-team-context.json
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          writeFileSync(process.env.VORTEX_PLAN_CONTEXT, JSON.stringify({
            horizon: Number(process.env.PLAN_HORIZON),
          }), { mode: 0o600 });
          JS
          node --import tsx scripts/export-my-team-plan.ts 145784 reports/my-team
      - name: Publish plan in the run summary
        run: cat reports/my-team/plan.md >> "$GITHUB_STEP_SUMMARY"

      - name: Install Chromium for the plan boards
        run: npx playwright install --with-deps chromium
      - name: Render lineup and transfer roadmap
        run: node --import tsx scripts/render-my-team-boards.ts reports/my-team/plan.json reports/my-team/graphics
      - name: Save the current plan and graphics
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/save-my-team-output.sh reports/my-team
      - name: Replace the current six-player PNG in Google Drive
        env:
          VORTEX_DRIVE_OAUTH: ${{ secrets.VORTEX_DRIVE_OAUTH }}
          VORTEX_DRIVE_PNG_ID: ${{ vars.VORTEX_DRIVE_PNG_ID || '1IgBRh4oQKaLNRK_02cZ_xOeLYHBqNzUm' }}
        run: node scripts/save-player-considerations-drive.mjs reports/my-team/graphics/FPL_VORTEX_players_to_consider.png
