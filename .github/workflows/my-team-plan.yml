name: My Team - five gameweek plan
on:
  workflow_dispatch:
    inputs:
      entry_id:
        description: Public FPL entry ID
        required: true
        default: '145784'
        type: string
      horizon:
        description: Number of gameweeks to plan
        default: '5'
        type: choice
        options: ['1', '2', '3', '4', '5', '6', '7', '8']
      context_json:
        description: Optional dated cohort and team-news context as JSON (no secrets)
        type: string
      render_graphics:
        description: Generate graphics and upload them in the ZIP
        default: false
        type: boolean
      upload_zip:
        description: Upload the Markdown and JSON ZIP (requires available Actions storage)
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: manual-my-team-plan
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --import tsx --test tests/my-team-plan.test.ts
      - name: Generate read-only text plan
        env:
          ENTRY_ID: ${{ inputs.entry_id }}
          PLAN_HORIZON: ${{ inputs.horizon }}
          PLAN_CONTEXT_JSON: ${{ inputs.context_json }}
          VORTEX_PLAN_CONTEXT: ${{ runner.temp }}/my-team-context.json
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const context = JSON.parse(process.env.PLAN_CONTEXT_JSON || '{}');
          if (context === null || typeof context !== 'object' || Array.isArray(context)) {
            throw new Error('Planning context must be a JSON object.');
          }
          writeFileSync(process.env.VORTEX_PLAN_CONTEXT, JSON.stringify({
            ...context,
            horizon: Number(process.env.PLAN_HORIZON),
          }), { mode: 0o600 });
          JS
          node --import tsx scripts/export-my-team-plan.ts "$ENTRY_ID" reports/my-team
      - name: Publish text summary
        run: cat reports/my-team/plan.md >> "$GITHUB_STEP_SUMMARY"
      - if: inputs.render_graphics
        run: npx playwright install --with-deps chromium
      - name: Render separate reference-style pitch and player analysis boards
        if: inputs.render_graphics
        run: node --import tsx scripts/render-my-team-boards.ts reports/my-team/plan.json reports/my-team/graphics
      - name: Upload requested report ZIP
        if: inputs.upload_zip || inputs.render_graphics
        uses: actions/upload-artifact@v4
        with:
          name: my-team-plan
          path: |
            reports/my-team/*.md
            reports/my-team/*.json
            reports/my-team/accountability/20*/
            reports/my-team/graphics/
          if-no-files-found: error
