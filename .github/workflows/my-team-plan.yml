name: My Team Planner
on:
  # Temporary, same-repository validation trigger. Remove before merging.
  pull_request:
    types: [synchronize]
  workflow_dispatch:
    inputs:
      horizon:
        description: Upcoming gameweeks from the next deadline
        default: '5'
        type: choice
        options: ['1', '2', '3', '4', '5', '6', '7', '8']
      completed_transfers:
        description: 'Completed free transfers as JSON with gameweek and moves (outId, inId, sellTenths, buyTenths)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: manual-my-team-plan
  cancel-in-progress: false
jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/my-team-planner-quality')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --import tsx --test tests/my-team-plan.test.ts
      - name: Generate plan from the next official deadline
        env:
          VORTEX_COMPLETED_TRANSFERS: ${{ inputs.completed_transfers }}
          PLAN_HORIZON: ${{ inputs.horizon || '8' }}
          VORTEX_PLAN_CONTEXT: ${{ runner.temp }}/my-team-context.json
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          writeFileSync(process.env.VORTEX_PLAN_CONTEXT, JSON.stringify({
            horizon: Number(process.env.PLAN_HORIZON),
          }), { mode: 0o600 });
          JS
          node --import tsx scripts/export-my-team-plan.ts 145784 reports/my-team
      - name: Verify live squad and report transfer alternatives
        run: |
          jq -e '.weeks | length > 0' reports/my-team/plan.json >/dev/null
          jq '{horizon, currentRank, currentPoints, stateBasis, openingState, openingTransferDecision, openingTransferRisk, gainVsHold, totalXPts, weeks: [.weeks[] | {gw, currentSquad: [.currentSquad[] | {id,name,club,position}], transfers: [.transfers[] | {out: .out.name, in: .incoming.name, inClub: .incoming.club, remainingHorizonPlayerGain}], xPts, hitCost, bankAfter, ftAfter, deltaVsHoldThisWeek}], openingAlternatives}' reports/my-team/plan.json
      - name: Publish plan in the run summary
        run: |
          cat reports/my-team/plan.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n## Copy-ready caption and hashtags\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          cat reports/my-team/caption.txt >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Install Chromium for the plan boards
        run: npx playwright install --with-deps chromium
      - name: Render lineup and transfer roadmap
        run: node --import tsx scripts/render-my-team-boards.ts reports/my-team/plan.json reports/my-team/graphics
      - name: Prepare the two PNGs and caption
        run: |
          mkdir -p reports/my-team/current
          cp -- reports/my-team/graphics/FPL_VORTEX_transfer_roadmap.png reports/my-team/current/01-FPL-VORTEX-Transfer-Roadmap.png
          cp -- reports/my-team/graphics/FPL_VORTEX_players_to_consider.png reports/my-team/current/02-FPL-VORTEX-Players-to-Consider.png
          cp -- reports/my-team/caption.txt reports/my-team/current/03-FPL-VORTEX-Caption-and-Hashtags.txt
      - name: Preserve verified output for connected Drive delivery
        uses: actions/upload-artifact@v4
        with:
          name: my-team-delivery
          path: reports/my-team/current/
          if-no-files-found: error
          retention-days: 7
      - name: Save the three files in My Drive / My Team
        id: drive
        env:
          VORTEX_DRIVE_OAUTH: ${{ secrets.VORTEX_DRIVE_OAUTH }}
          VORTEX_DRIVE_FOLDER_ID: ${{ vars.VORTEX_MY_TEAM_FOLDER_ID || '1-VAcLdUHQgt__sU3yf-RHTBvIsk76dhF' }}
        run: node scripts/save-player-considerations-drive.mjs reports/my-team/current
      - name: Require verified Drive save during branch validation
        if: github.event_name == 'pull_request'
        run: test '${{ steps.drive.outputs.saved }}' = true
      - name: Save separate files in the private GitHub release when Drive is unconfigured
        if: github.event_name == 'workflow_dispatch' && steps.drive.outputs.saved != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/save-my-team-output.sh reports/my-team/current
