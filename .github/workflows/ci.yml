name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit and model tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify offline snapshot
        run: |
          node -e "const s=require('./public/data/fpl-snapshot.json'); if(!s.players?.length||!s.fixtures?.length) process.exit(1); console.log('Snapshot OK:',s.players.length,'players');"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fpl-vortex-dist
          path: dist/
          retention-days: 7

  python-solver:
    name: Python transfer solver
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: fpl_solver/requirements.txt
      - run: python -m pip install -r fpl_solver/requirements.txt
      - run: python -m pytest -q fpl_solver/tests
      - run: python -m fpl_solver.examples.run_example > /dev/null
