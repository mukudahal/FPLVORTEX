name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit and model tests
        run: npm test

      - name: Production build
        run: npm run build

      # Passive read-only check of the currently deployed Render service. No secrets,
      # paid feed refreshes, deployments or fixture state changes are performed.
      - name: Audit current production bookmaker coverage (read-only)
        continue-on-error: true
        run: node scripts/audit-live-odds.mjs

      # P4: inspect live Render endpoints without changing state or disclosing names.
      - name: Audit live manager, league, video and snapshot provenance (read-only)
        continue-on-error: true
        run: node scripts/audit-live-source-integrity.mjs

      - name: Measure current production loading (read-only)
        continue-on-error: true
        run: node scripts/audit-live-loading.mjs

      - name: Verify offline snapshot
        run: |
          node -e "const s=require('./public/data/fpl-snapshot.json'); if(!s.players?.length||!s.fixtures?.length) process.exit(1); console.log('Snapshot OK:',s.players.length,'players');"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fpl-vortex-dist
          path: dist/
          retention-days: 7

  python-solver:
    name: Python transfer solver
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: fpl_solver/requirements.txt
      - run: python -m pip install -r fpl_solver/requirements.txt
      - run: python -m pytest -q fpl_solver/tests
      - run: python -m fpl_solver.examples.run_example > /dev/null
      - name: P0-A09 — realistic 40-player / 10-GW all-chip feasibility benchmark
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'upgrade/p0-a09-')
        run: |
          set -o pipefail
          python -m fpl_solver.examples.benchmark_joint_horizon --candidates 30 --horizon 10 | tee joint-milp-benchmark-30.json
          python -m fpl_solver.examples.benchmark_joint_horizon --candidates 40 --horizon 10 | tee joint-milp-benchmark-40.json
      - name: Enforce staged 30-player horizon MIP gap; disclose unrestricted 40-player limitations
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'upgrade/p0-a09-')
        run: |
          python3 - <<'PY'
          import json
          with open('joint-milp-benchmark-30.json') as f:
              staged = json.load(f)
          with open('joint-milp-benchmark-40.json') as f:
              stress = json.load(f)
          assert staged.get('release_performance_gate_met'), ('30-player full-horizon staged release gate failed', staged)
          if not stress.get('release_performance_gate_met'):
              print('::warning title=P0-A09 40-player stress limit::Full 40-player 10-GW release gate not met; staged 8–10 GW optimization is capped at a disclosed 30 candidates.')
          print('Verified staged 30-player/10-GW MILP release speed-and-gap criterion.', staged['elapsed_seconds'], 's', staged['mip_gap'])
          PY
      - name: Upload joint-chip benchmark evidence
        if: always() && github.event_name == 'pull_request' && startsWith(github.head_ref, 'upgrade/p0-a09-')
        uses: actions/upload-artifact@v4
        with:
          name: p0-a09-joint-milp-benchmark
          path: joint-milp-benchmark-*.json
          retention-days: 14


  planner-browser:
    name: Planner browser and worker
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start production server
        run: |
          NODE_ENV=production npm start > /tmp/vortex-planner-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/vortex-planner-server.log
          exit 1
      - name: Exercise existing planner and simulation tabs
        run: node scripts/check-planner-browser.mjs
      - name: Start isolated PNG rendering fixture
        run: |
          npx vite --config tests/browser/vite.config.ts --host 127.0.0.1 --port 5174 > /tmp/vortex-png-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5174/tests/browser/pitch-export.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vortex-png-vite.log
          exit 1
      - name: Verify 4K pitch and table PNG downloads in Chromium
        run: node scripts/check-png-browser.mjs
      - name: Build isolated joint-chip staging bundle (NOT a hosted deployment)
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'upgrade/p0-a09-')
        run: VITE_VORTEX_JOINT_SOLVER_UI_ENABLED=1 npm run build
      - name: Start isolated opt-in research server on local port 3001
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'upgrade/p0-a09-')
        run: |
          PORT=3001 VORTEX_JOINT_SOLVER_ENABLED=1 NODE_ENV=production npm start > /tmp/vortex-joint-staging.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/vortex-joint-staging.log
          exit 1
      - name: Exercise staging chip UI, default-save safety and read-only input rejection
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'upgrade/p0-a09-')
        run: PLANNER_BASE_URL=http://127.0.0.1:3001 node scripts/check-joint-staging-browser.mjs
      - name: Verify automatic production deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/check-planner-deployment.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planner-browser-evidence
          path: test-results/planner/
          retention-days: 7


  next-app-parity:
    name: Next.js candidate — build and test parity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: 1_APP_dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 1_APP_dashboard/package-lock.json

      - name: Install Next.js candidate dependencies
        run: npm ci

      - name: Check migration ordering (no database writes)
        run: npm run db:migrate:dry-run

      - name: Run existing planner and security unit tests
        run: npm run test:planning

      - name: Typecheck Next.js candidate
        run: npm run typecheck

      - name: Lint Next.js candidate
        run: npm run lint

      - name: Production build without a live database
        run: npm run build
        env:
          DATABASE_URL: postgresql://audit:placeholder@127.0.0.1:5432/vortex_audit
          NEXT_PUBLIC_SITE_URL: https://staging.example.invalid
          FPL_AI_ENABLED: 'false'

  exact-milp-runtime:
    name: Exact no-chip MILP production container smoke
    # Run production-container verification when the live Python MILP runtime or
    # its cash-flow mathematics changes. Other PRs retain the existing gate.
    if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'upgrade/p0-a06-') || startsWith(github.head_ref, 'upgrade/p0-a08-') || startsWith(github.head_ref, 'upgrade/p0-a09-'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build exact solver production Docker image
        run: docker build -t vortex-milp-ci .
      - name: Verify SciPy is installed in the deployed runtime image
        run: docker run --rm --entrypoint /opt/vortex-milp/bin/python vortex-milp-ci -c "from fpl_solver.solver import solve; import scipy; print('HiGHS runtime ready', scipy.__version__)"
      - name: Exercise bounded exact MILP via real Express API
        run: |
          docker run -d --name vortex-milp-ci-run -p 3000:3000 vortex-milp-ci
          trap 'docker rm -f vortex-milp-ci-run >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 2
          done
          python3 - <<'PY'
          import json
          with open("fpl_solver/examples/sample_input.json") as file:
              request = json.load(file)
          request["settings"].update({
              "end_gw": 1, "time_limit_seconds": 5,
              "solutions_requested": 1, "mip_gap": 0.02,
              "free_transfer_value": 0, "bank_value_per_million": 0,
          })
          with open("/tmp/vortex-milp-ci-input.json", "w") as file:
              json.dump(request, file)
          # The second production HTTP call verifies first-sale discount
          # is used once even after original player 15 is re-purchased.
          with open("fpl_solver/examples/sample_input.json") as file:
              rebuy = json.load(file)
          rebuy["settings"].update({
              "end_gw": 3, "time_limit_seconds": 9,
              "solutions_requested": 1, "mip_gap": 0.02,
              "max_transfers_per_gw": 1, "max_total_hits": 0,
              "free_transfer_value": 0, "bank_value_per_million": 0,
              "forced_transfers": [
                  {"gw": 1, "player_out": 15, "player_in": 24},
                  {"gw": 2, "player_out": 24, "player_in": 15},
                  {"gw": 3, "player_out": 15, "player_in": 24},
              ],
          })
          with open("/tmp/vortex-milp-ci-rebuy.json", "w") as file:
              json.dump(rebuy, file)
          PY
          curl --fail --silent --show-error --max-time 20 \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/vortex-milp-ci-input.json \
            http://127.0.0.1:3000/api/vortex/solver/exact \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r.get("plans"), r; print("bounded HTTP MILP smoke OK")'
          curl --fail --silent --show-error --max-time 20 \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/vortex-milp-ci-rebuy.json \
            http://127.0.0.1:3000/api/vortex/solver/exact \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r.get("plans"), r; w=r["plans"][0]["gameweeks"]; assert [a["bank"] for a in w]==[3.9,3.9,3.9], w; assert [a["transfers_in"] for a in w]==[[24],[15],[24]]; print("HTTP original sale/rebuy/resale cash-flow OK")'
          # A production image must NEVER expose the research joint endpoint
          # without its two explicit server/client staging flags.
          joint_status=$(curl --silent --show-error --max-time 5 \
            -o /tmp/vortex-joint-disabled.json -w '%{http_code}' \
            -H 'Content-Type: application/json' --data '{}' \
            http://127.0.0.1:3000/api/vortex/solver/joint)
          test "$joint_status" = "503"
          python3 -c 'import json; r=json.load(open("/tmp/vortex-joint-disabled.json")); assert "not enabled" in r.get("error",""), r; print("Research joint API is default-OFF in production Docker runtime")'
          private_status=$(curl --silent --show-error --max-time 5 \
            -o /tmp/vortex-myteam-disabled.json -w '%{http_code}' \
            http://127.0.0.1:3000/api/vortex/solver/current-team?entryId=12345)
          test "$private_status" = "503"
          python3 -c 'import json; r=json.load(open("/tmp/vortex-myteam-disabled.json")); assert "not enabled" in r.get("error",""), r; print("Private manager current-team API is default-OFF in production Docker runtime")'

      - name: Exercise isolated research joint-chip CLI in production image
        if: startsWith(github.head_ref, 'upgrade/p0-a09-')
        run: |
          python3 - <<'PY'
          import json
          with open('fpl_solver/examples/sample_input.json') as file:
              data = json.load(file)
          data['current_team']['current_gameweek'] = 2
          data['settings'].update({
              'start_gw': 2, 'end_gw': 2,
              'time_limit_seconds': 8, 'mip_gap': .02,
              'solutions_requested': 1,
              'scoring_chip_halves': {},
              'squad_chip_halves': {'free_hit': [1]},
              'forced_chip_uses': {'2': 'free_hit'},
          })
          with open('/tmp/vortex-joint-ci.json', 'w') as file:
              json.dump(data, file)
          PY
          docker run --rm -i --entrypoint /opt/vortex-milp/bin/python vortex-milp-ci \
            -m fpl_solver.joint_cli < /tmp/vortex-joint-ci.json \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r.get("plans"), r; w=r["plans"][0]["gameweeks"][0]; assert w["chip"]=="free_hit" and w["temporary_bank"] is not None and w["permanent_squad_after"], w; print("Production image research WC/FH MILP smoke OK")'
