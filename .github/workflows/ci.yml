name: FPLVORTEX checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fplvortex_test
          POSTGRES_PASSWORD: local_ci_password
          POSTGRES_DB: fplvortex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fplvortex_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://fplvortex_test:local_ci_password@127.0.0.1:5432/fplvortex_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck, build, and test
        run: npm test