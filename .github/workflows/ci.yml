name: FPLVORTEX checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fplvortex_test
          POSTGRES_PASSWORD: local_ci_password
          POSTGRES_DB: fplvortex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fplvortex_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://fplvortex_test:local_ci_password@127.0.0.1:5432/fplvortex_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck, build, and test
        run: npm test

      - name: FPL v0.8 one-time owner-supplied entry research check
        run: |
          node --input-type=module <<'JS'
          import {fetchLiveFplEntry} from './scripts/fpl-entry-client.mjs';
          try {
            const s=await fetchLiveFplEntry('145784',{bypassCache:true});
            const m=s.liveResearch;
            console.log('FPL_RESEARCH_RESULT',JSON.stringify({
              entryId:s.entryId,rank:s.overallRank,points:s.overallPoints,
              sourceTimestamp:s.fetchedAt,realPlayers:s.picks?.players?.length??0,
              researchAvailable:!!m,planningGW:m?.nextGameweek??null,
              throughGW:m?.throughGameweek??null,
              captain:m?.captain??null,reviewOnly:m?.suggestedActions?.slice(0,3)??[],
              observedStarts:m?.ownPlayers?.filter(p=>p.starts!==null).length??0,
              fixtureCoverage:m?.roadmap?.filter(w=>w.captain!==null).length??0
            }));
          } catch (error) { console.log('FPL_RESEARCH_UNAVAILABLE',error.message); }
          JS
