name: Check current site
on:
  push:
    paths: ["site/**", ".github/workflows/check-site.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/check-site.yml"]
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run build
      - run: npm run validate
      - run: node scripts/check-dashboard.mjs
      - run: python scripts/check-contrast.py
      - run: node scripts/smoke-test.mjs
      - run: node scripts/build-vercel.mjs
